name: Deploy demo to GitHub Pages

on:
  push:
    # The published docs site tracks the blessed channel only — `unstable` gets
    # CI (see ci.yml) but must not redeploy the page out from under consumers.
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages resolves the build job's artifact by id, which reads the
  # Actions API. Documented as required since deploy-pages@v4.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # Same guard as ci.yml: `electron` is a devDependency for its types alone,
      # and older lines postinstall a ~270 MB binary. The deploy path needs it
      # just as much as the check job does.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
